name: Bounded isolated research fallback
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: read
concurrency:
  group: thesisbreak-research-fallback
  cancel-in-progress: false
jobs:
  research:
    if: vars.RESEARCH_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r workers/research/requirements-research.lock
      - run: python -m pip install --no-deps './workers/research'
      - name: Dispatch persisted research inputs (no provider or signing credentials)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEARCH_OWNER_ID: ${{ vars.RESEARCH_OWNER_ID }}
          RESEARCH_WORKER_ENABLED: "true"
          RESEARCH_MAX_JOBS: "10"
          RESEARCH_DAILY_JOB_LIMIT: "100"
          RESEARCH_DEADLINE_MS: "120000"
        run: pnpm exec tsx scripts/research-worker.ts
