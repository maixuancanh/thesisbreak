name = "thesisbreak-forecast-clock"
main = "src/cloudflare-forecast-cron.ts"
compatibility_date = "2026-10-29"
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[vars]
FORECAST_CHALLENGER_ENABLED = "true"
FORECAST_CHALLENGER_MODE = "shadow"
SOURCE_WATCH_ENABLED = "true"

[observability]
enabled = true
