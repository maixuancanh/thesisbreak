[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thesisbreak-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.2"]

[project.optional-dependencies]
research = ["river==0.26.1", "netcal==1.4.0", "gepa==0.1.4", "forecasting-tools==0.3.5", "pandas==3.1.0"]
test = ["pytest==9.2.0"]

[project.scripts]
thesisbreak-research = "thesisbreak_research.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
